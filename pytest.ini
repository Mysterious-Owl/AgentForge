[pytest]
# The suite is offline and deterministic, so a clean run prints only the dots and the count.
# Warnings stay ON - a new deprecation should show up - and only the known ones are filtered.

# pytest-asyncio (pinned in requirements.txt) warns on every run while this is unset.
asyncio_default_fixture_loop_scope = function

filterwarnings =
    # starlette 1.x asks TestClient users to move to the `httpx2` package; this stack pins
    # httpx 0.28.1 (as Week 16 does), which TestClient still fully supports.
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
